name: ci
on:
  push: { branches: [ main, master ] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x        # ← indented under the step
      - name: Confirm SDK
        run: dotnet --info
      - name: Restore (verbose — surfaces the real error)
        run: dotnet restore Geospatial.slnx -v:m
      - name: Build
        run: dotnet build Geospatial.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Geospatial.slnx -c Release --no-restore --filter Category!=Gdal