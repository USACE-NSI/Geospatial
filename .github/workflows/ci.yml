name: ci
on:
  push: { branches: [ main, master ] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Confirm SDK
        run: dotnet --info

      # The `gdal` 3.11.3 NuGet is managed-only; the OSGeo.OGR/OSR assemblies P/Invoke
      # into the native GDAL runtime, which must exist on the agent. conda-forge's
      # gdal 3.11 provides libgdal + the C# wrapper .so's + gdal/proj data in one prefix.
      - name: Install GDAL native runtime (matches gdal 3.11.3 managed wrapper)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal
          create-name: gdal
          extra-mamba-repos: conda-forge
          mamba-file: |
            name: gdal
            channels:
              - conda-forge
            dependencies:
              - gdal=3.11

      - name: Export GDAL environment for the OSGeo OGR bindings
        run: |
          echo "CONDA_PREFIX=${CONDA_PREFIX}" >> "$GITHUB_ENV"
          echo "GDAL_DATA=${CONDA_PREFIX}/share/gdal" >> "$GITHUB_ENV"
          echo "PROJ_DATA=${CONDA_PREFIX}/share/proj" >> "$GITHUB_ENV"
          echo "PROJ_LIB=${CONDA_PREFIX}/share/proj" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "${CONDA_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Verify GDAL
        run: |
          gdalinfo --version
          ls -1 "${CONDA_PREFIX}/lib" | grep -iE 'gdal|ogr|osr|proj' || true

      - name: Restore
        run: dotnet restore Geospatial.slnx -v:n

      - name: Build
        run: dotnet build Geospatial.slnx -c Release --no-restore

      # Existing behaviour: run the suite, skipping Gdal-category tests elsewhere.
      - name: Test (non-Gdal)
        run: dotnet test Geospatial.slnx -c Release --no-restore --filter Category!=Gdal

      # New: run the spatial reader/writer tests (they need GDAL, now present).
      - name: Test (Nsi.Geospatial.Io.Tests)
        run: dotnet test tests/Nsi.Geospatial.Io.Tests/Nsi.Geospatial.Io.Tests.csproj -c Release --no-restore